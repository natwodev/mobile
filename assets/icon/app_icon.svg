<svg width="1024" height="1024" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Trắc nghiệm trực tuyến">
  <!-- Nền tràn viền: iOS/Android tự bo góc theo mặt nạ của hệ điều hành,
       nên KHÔNG tự bo góc ở đây (bo hai lần sẽ ra viền méo). -->
  <rect width="64" height="64" fill="#2563eb"/>
  <!-- Chữ A và dấu cộng vẽ bằng đường path, KHÔNG dùng <text>: thẻ text lấy
       phông của máy nên máy thiếu phông sẽ ra chữ méo hoặc trống. -->
  <g transform="translate(-1.875 0)">
    <path d="M15 45 L26 19 L37 45" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M19.5 37 H32.5" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <path d="M47 23 V35 M41 29 H53" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
